name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "🔍 Checking SSH configuration..."
          if [ -z "$SSH_HOST" ]; then echo "❌ SSH_HOST is empty!"; exit 1; fi
          if [ -z "$SSH_USER" ]; then echo "❌ SSH_USER is empty!"; exit 1; fi
          if [ -z "$SSH_KEY" ]; then echo "❌ SSH_KEY is empty!"; exit 1; fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps

          echo "🚀 Testing connection to $SSH_USER@$SSH_HOST..."
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" bash -s << 'EOF'
            set -e
            echo "✅ Connected to VPS successfully!"

            echo "📁 Entering project directory..."
            cd /var/www/reinforced-view

            echo "📥 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing composer dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "🗄️ Running migrations..."
            php artisan migrate --force

            echo "🎨 Building frontend assets..."
            npm install
            npm run build

            echo "⚡ Refreshing Laravel cache..."
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔒 Setting permissions..."
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "🔄 Reloading web server..."
            systemctl reload php8.2-fpm
            systemctl reload nginx

            echo "🎉 Deployment Laravel selesai dengan sukses!"
          EOF
