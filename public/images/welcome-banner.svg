<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9C4D"/>
      <stop offset="100%" stop-color="#FF7704"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="grad-chart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Floating Network Connections / Graph Lines -->
  <g opacity="0.6" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4 4">
    <line x1="120" y1="90" x2="220" y2="60"/>
    <line x1="220" y1="60" x2="310" y2="110"/>
    <line x1="220" y1="60" x2="210" y2="160"/>
    <line x1="310" y1="110" x2="390" y2="80"/>
    <line x1="310" y1="110" x2="380" y2="180"/>
  </g>

  <!-- Floating Graph Nodes -->
  <g>
    <circle cx="120" cy="90" r="14" fill="#FFFFFF" filter="url(#soft-shadow)"/>
    <circle cx="120" cy="90" r="7" fill="#38BDF8"/>

    <circle cx="220" cy="60" r="18" fill="#FFFFFF" filter="url(#soft-shadow)"/>
    <circle cx="220" cy="60" r="9" fill="url(#grad-primary)"/>

    <circle cx="390" cy="80" r="16" fill="#FFFFFF" filter="url(#soft-shadow)"/>
    <circle cx="390" cy="80" r="8" fill="#10B981"/>

    <circle cx="380" cy="180" r="14" fill="#FFFFFF" filter="url(#soft-shadow)"/>
    <circle cx="380" cy="180" r="7" fill="#F43F5E"/>
  </g>

  <!-- Big Floating Analytics / Graph Card -->
  <g filter="url(#soft-shadow)">
    <!-- Main Card Body -->
    <rect x="180" y="90" width="220" height="150" rx="18" fill="#FFFFFF"/>
    
    <!-- Card Top Header -->
    <rect x="195" y="105" width="40" height="8" rx="4" fill="#E2E8F0"/>
    <circle cx="375" cy="109" r="4" fill="#10B981"/>
    <circle cx="362" cy="109" r="4" fill="#F59E0B"/>
    <circle cx="349" cy="109" r="4" fill="#EF4444"/>

    <!-- Mini Stat bar -->
    <rect x="195" y="125" width="70" height="12" rx="3" fill="#EEF2FF"/>
    <rect x="195" y="125" width="45" height="12" rx="3" fill="#6366F1"/>

    <!-- Chart Visual -->
    <path d="M 195 210 Q 230 150, 265 175 T 335 140 T 385 160 L 385 220 L 195 220 Z" fill="url(#grad-chart)"/>
    <path d="M 195 210 Q 230 150, 265 175 T 335 140 T 385 160" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Data Points on Curve -->
    <circle cx="265" cy="175" r="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="335" cy="140" r="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="385" cy="160" r="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  </g>

  <!-- Character (Researcher / Data Scientist) -->
  <g filter="url(#soft-shadow)">
    <!-- Chair / Stool -->
    <ellipse cx="120" cy="275" rx="36" ry="7" fill="#312E81" opacity="0.4"/>
    <path d="M 116 220 L 114 275 M 124 220 L 126 275" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- Character Legs -->
    <path d="M 105 185 L 100 230 L 125 240 L 140 270" fill="none" stroke="#1E1B4B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoes -->
    <path d="M 135 270 L 155 270 Q 158 277 150 277 L 130 277 Z" fill="#F8FAFC"/>

    <!-- Torso / Jacket -->
    <path d="M 90 145 C 90 130, 130 130, 130 145 L 125 195 L 85 195 Z" fill="#FF7704"/>

    <!-- Shirt Collar / Neck -->
    <path d="M 102 135 L 110 145 L 118 135 Z" fill="#FFFFFF"/>
    <rect x="105" y="125" width="10" height="12" rx="4" fill="#FCD34D"/>

    <!-- Head -->
    <circle cx="110" cy="112" r="15" fill="#FCD34D"/>
    <!-- Hair -->
    <path d="M 96 112 C 96 95, 124 95, 124 112 C 122 104, 115 100, 102 105 Z" fill="#1E293B"/>

    <!-- Left Arm holding tablet / book -->
    <path d="M 92 145 Q 80 165, 105 175" fill="none" stroke="#FF7704" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Laptop / Research Note -->
    <rect x="100" y="160" width="38" height="26" rx="4" transform="rotate(-15 100 160)" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="106" y1="168" x2="124" y2="163" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="174" x2="126" y2="169" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Arm working -->
    <path d="M 125 145 Q 145 160, 135 178" fill="none" stroke="#FF8222" stroke-width="9" stroke-linecap="round"/>
    <circle cx="134" cy="178" r="5" fill="#FCD34D"/>
  </g>

  <!-- Small Floating Badge 1: Collaboration Recommendation / Match 98% -->
  <g filter="url(#soft-shadow)">
    <rect x="250" y="22" width="125" height="38" rx="12" fill="#FFFFFF"/>
    <circle cx="270" cy="41" r="10" fill="#10B981"/>
    <!-- Checkmark icon -->
    <path d="M 266 41 L 269 44 L 275 38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="288" y="37" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1E293B">A.I. Match</text>
    <text x="288" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#059669">98.5% Cocok</text>
  </g>

  <!-- Small Floating Badge 2: Idea / Research Lightbulb -->
  <g filter="url(#soft-shadow)">
    <circle cx="70" cy="140" r="20" fill="#FEF3C7"/>
    <path d="M 70 129 C 64 129, 60 133, 60 138 C 60 141, 62 144, 64 146 L 64 149 C 64 150, 65 151, 66 151 L 74 151 C 75 151, 76 150, 76 149 L 76 146 C 78 144, 80 141, 80 138 C 80 133, 76 129, 70 129 Z" fill="#F59E0B"/>
    <rect x="67" y="152" width="6" height="2" rx="1" fill="#D97706"/>
  </g>
</svg>
